<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Para Natalia</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #efe9df;

        }
        canvas {
            max-width: 95vw;
            max-height: 76vh;

            margin: 10px 0 4px;

            transition: opacity 2s;
        }
        #texto.visible { opacity: 1; }

            margin: 4px 0 12px;
            padding: 7px 18px;

            background: #b0405f;

        }
    </style>
</head>
<body>
    <canvas id="cuadro" width="735" height="877"></canvas>
    <p id="texto">Te amo Natalia</p>
    <button onclick="iniciar()">Volver a dibujar</button>

<script>
const W = 735, H = 877;
const cvs = document.getElementById("cuadro");
const ctx = cvs.getContext("2d");
const base = document.createElement("canvas");
base.width = W; base.height = H;
const bctx = base.getContext("2d");
const PAPER = "#f1ece3";

/* ---------- Utilidades ---------- */
function rng(seed) {
    let a = seed >>> 0;
    return function () {
        a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
}
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const ease = p => p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
const sub = (p, i, n) => clamp((p - (i / n) * 0.65) / 0.35);
const pick = (r, arr) => arr[Math.floor(r() * arr.length)];

function line(c, x, y, len, ang, col, a, w) {
    c.globalAlpha = a;
    c.strokeStyle = col;
    c.lineWidth = w;
    c.lineCap = "round";
    c.beginPath();
    c.moveTo(x, y);
    c.lineTo(x + Math.cos(ang) * len, y + Math.sin(ang) * len);
    c.stroke();
    c.globalAlpha = 1;
}

function newCanvas(w, h) {
    const cv = document.createElement("canvas");
    cv.width = w; cv.height = h;
    return cv;
}

/* ---------- Fondo: trazos de lápiz azul y oliva ---------- */
const BLUES = ["#5f78bf", "#7b92d2", "#8ea5dc", "#4f66ab", "#9db2e3"];
const OLIVES = ["#8a9468", "#7a8758", "#a3aa84", "#95a073", "#6f7d50", "#b5b99a"];
const GRAYS = ["#a9aeb8", "#9aa3b5", "#b8bcc4"];

function genFondo() {
    const r = rng(11), out = [];
    const cx = 355, cy = 400, rx = 350, ry = 480;
    let tries = 0;
    while (out.length < 22000 && tries < 120000) {
        tries++;
        const x = r() * W, y = r() * 690;
        const u = Math.hypot((x - cx) / rx, (y - cy) / ry);
        if (u > 1.03) continue;
        if (u > 0.85 && r() > (1.03 - u) / 0.18) continue;
        let blueW = clamp((u - 0.3) / 0.6);
        if (x > 560 || x < 150) blueW = clamp(blueW + 0.25);
        let col, a;
        if (r() < blueW) { col = pick(r, BLUES); a = 0.3 + r() * 0.3; }
        else if (r() < 0.18) { col = pick(r, GRAYS); a = 0.3 + r() * 0.25; }
        else { col = pick(r, OLIVES); a = 0.3 + r() * 0.3; }
        out.push({ x, y, len: 14 + r() * 26, ang: -0.95 + (r() - 0.5) * 0.5, col, a, w: 1.2 + r() * 1.3 });
    }
    return out;
}

function genMesa() {
    const r = rng(23), out = [];
    const TB = ["#56603c", "#6b7548", "#7c8a58", "#3f4a30", "#8c9468", "#4c5636"];
    const HB = ["#9aa3b5", "#8fa0b8", "#a9b0a0"];
    for (let i = 0; i < 11000; i++) {
        const x = r() * W;
        const y = 662 + Math.pow(r(), 0.85) * (H - 662);
        if (x > 715 && r() < 0.7) continue;
        let col, a;
        if (y < 700 && r() < 0.6) { col = pick(r, HB); a = 0.3 + r() * 0.2; }
        else {
            col = pick(r, TB); a = 0.28 + r() * 0.3;
            if (y > 790 && r() < 0.5) col = pick(r, ["#3f4a30", "#4c5636", "#2f3826"]);
        }
        out.push({ x, y, len: 16 + r() * 26, ang: (r() - 0.5) * 0.5 - 0.15, col, a, w: 1.4 + r() * 1.6 });
    }
    return out;
}

const FONDO = genFondo();
const MESA = genMesa();
const stFondo = { n: 0 };
const stMesa = { n: 0, sh: false };

function fondoFn(c, p) {
    const target = Math.floor(p * FONDO.length);
    for (; stFondo.n < target; stFondo.n++) {
        const s = FONDO[stFondo.n];
        line(c, s.x, s.y, s.len, s.ang, s.col, s.a, s.w);
    }
}

function mesaFn(c, p) {
    const target = Math.floor(p * MESA.length);
    for (; stMesa.n < target; stMesa.n++) {
        const s = MESA[stMesa.n];
        line(c, s.x, s.y, s.len, s.ang, s.col, s.a, s.w);
    }
    if (p >= 1 && !stMesa.sh) {
        stMesa.sh = true;
        c.save();
        c.translate(368, 834);
        c.scale(1, 0.16);
        const g = c.createRadialGradient(0, 0, 10, 0, 0, 230);
        g.addColorStop(0, "rgba(35,28,15,0.6)");
        g.addColorStop(1, "rgba(35,28,15,0)");
        c.fillStyle = g;
        c.beginPath();
        c.arc(0, 0, 230, 0, Math.PI * 2);
        c.fill();
        c.restore();
    }
}

/* ---------- Hojas ---------- */
const LEAF = {
    dark: { base: "#2f5d2e", mid: "#3f7a3a", tip: "#5d9a4a", hatch: ["#1f4a28", "#2f6b36", "#4c8a42", "#7fb35a"], vein: "#a8d27a", edge: "#1d3f20" },
    mid:  { base: "#3c7a38", mid: "#5a9a45", tip: "#86bf5c", hatch: ["#2f6b36", "#4f9140", "#7fb85a", "#a6d46e"], vein: "#c8e48f", edge: "#285a2c" },
    light:{ base: "#6c9f3f", mid: "#9fcb62", tip: "#c9e287", hatch: ["#7fb34a", "#a8d46a", "#d4e895", "#5a9a3a"], vein: "#eef5b8", edge: "#4a8030" }
};

function makeLeaf(len, wid, tone, seed) {
    const pal = LEAF[tone], r = rng(seed);
    const S = Math.ceil((len + wid + 20) * 2);
    const cv = newCanvas(S, S), c = cv.getContext("2d");
    c.translate(S / 2, S / 2);
    const path = () => {
        c.beginPath();
        c.moveTo(0, 0);
        c.bezierCurveTo(wid * 1.5, -len * 0.22, wid * 1.2, -len * 0.78, 0, -len);
        c.bezierCurveTo(-wid * 1.2, -len * 0.78, -wid * 1.5, -len * 0.22, 0, 0);
        c.closePath();
    };
    path();
    const g = c.createLinearGradient(0, 0, 0, -len);
    g.addColorStop(0, pal.base); g.addColorStop(0.5, pal.mid); g.addColorStop(1, pal.tip);
    c.fillStyle = g; c.fill();

    c.save();
    path(); c.clip();
    const n = Math.floor(len * wid * 0.9);
    for (let i = 0; i < n; i++) {
        const s = r() * 0.98;
        const half = wid * Math.sin(Math.PI * Math.pow(s, 0.85));
        const x = (r() * 2 - 1) * half;
        const side = x >= 0 ? 1 : -1;
        line(c, x, -s * len, 6 + r() * 12, Math.atan2(-1, side * 0.55), pick(r, pal.hatch), 0.3 + r() * 0.3, 1 + r() * 1.2);
    }
    for (let i = 0; i < n * 0.3; i++) {
        const s = r() * 0.95;
        const half = wid * Math.sin(Math.PI * Math.pow(s, 0.85));
        line(c, -r() * half * 0.9, -s * len, 5 + r() * 9, Math.atan2(-1, -0.55), pal.hatch[2], 0.35, 1.2);
    }
    c.strokeStyle = pal.vein;
    c.globalAlpha = 0.75; c.lineWidth = 1.6;
    c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(wid * 0.08, -len * 0.5, 0, -len * 0.96); c.stroke();
    c.lineWidth = 1; c.globalAlpha = 0.4;
    for (let s = 0.14; s < 0.85; s += 0.11) {
        const half = wid * Math.sin(Math.PI * Math.pow(s, 0.85));
        for (const sd of [-1, 1]) {
            c.beginPath();
            c.moveTo(0, -s * len);
            c.quadraticCurveTo(sd * half * 0.5, -(s + 0.04) * len, sd * half * 0.85, -(s + 0.13) * len);
            c.stroke();
        }
    }
    c.globalAlpha = 1;
    c.restore();

    path();
    c.strokeStyle = pal.edge; c.globalAlpha = 0.55; c.lineWidth = 1.2; c.stroke(); c.globalAlpha = 1;
    return { cv, S };
}

/* ---------- Rosas ---------- */
const ROSA_A = { hi: "#f9d5de", mid: "#ec9bb1", dark: "#cf5876", r1in: "#df6f8e", r1out: "#f6c0cf", r2in: "#d4587b", r2out: "#f0a9bd", r3in: "#c2415f", r3out: "#e58aa5", core: "#9f2c4a", edge: "#b13f62", hatch: ["#f7c5d2", "#ffffff", "#e67c9a", "#c94b6c", "#f2a3b8"] };
const ROSA_D = { hi: "#f0a5b8", mid: "#de7a96", dark: "#bd4a68", r1in: "#cf5f7f", r1out: "#ec9cb2", r2in: "#c24e70", r2out: "#e08aa2", r3in: "#b13a58", r3out: "#d57590", core: "#8e2440", edge: "#9e3556", hatch: ["#f0a3b6", "#fbd0da", "#d0587a", "#b03e5e"] };

function makeRose(r0, seed, pal) {
    const r = rng(seed);
    const S = Math.ceil(r0 * 2.8);
    const cv = newCanvas(S, S), c = cv.getContext("2d");
    c.translate(S / 2, S / 2);
    const ph = r() * 6.283;
    const blob = (R, w) => {
        c.beginPath();
        for (let a = 0; a <= Math.PI * 2 + 0.01; a += 0.08) {
            const k = R * (1 + w * Math.sin(a * 5 + ph) + w * 0.6 * Math.sin(a * 8 + ph * 1.7));
            const x = Math.cos(a) * k, y = Math.sin(a) * k * 0.93;
            a === 0 ? c.moveTo(x, y) : c.lineTo(x, y);
        }
        c.closePath();
    };

    blob(r0, 0.05);
    const g = c.createRadialGradient(-0.2 * r0, -0.25 * r0, r0 * 0.1, 0, 0, r0 * 1.15);
    g.addColorStop(0, pal.hi); g.addColorStop(0.55, pal.mid); g.addColorStop(1, pal.dark);
    c.fillStyle = g; c.fill();

    const petal = (a, d0, d1, w, cIn, cOut) => {
        c.save();
        c.rotate(a);
        c.beginPath();
        c.moveTo(0, -d0);
        c.bezierCurveTo(w, -d0 - (d1 - d0) * 0.25, w * 1.15, -d1 + (d1 - d0) * 0.12, 0, -d1);
        c.bezierCurveTo(-w * 1.15, -d1 + (d1 - d0) * 0.12, -w, -d0 - (d1 - d0) * 0.25, 0, -d0);
        c.closePath();
        const gg = c.createLinearGradient(0, -d0, 0, -d1);
        gg.addColorStop(0, cIn); gg.addColorStop(1, cOut);
        c.fillStyle = gg; c.fill();
        c.strokeStyle = pal.edge; c.globalAlpha = 0.5; c.lineWidth = 1.2; c.stroke();
        c.beginPath();
        c.moveTo(-w * 0.8, -d1 + (d1 - d0) * 0.16);
        c.quadraticCurveTo(0, -d1 - (d1 - d0) * 0.04, w * 0.8, -d1 + (d1 - d0) * 0.16);
        c.strokeStyle = "#ffffff"; c.globalAlpha = 0.45; c.lineWidth = 2; c.stroke();
        c.globalAlpha = 1;
        c.restore();
    };

    const rings = [
        { n: 7, d0: 0.12, d1: 1.0, w: 0.46, ci: pal.r1in, co: pal.r1out, off: 0 },
        { n: 6, d0: 0.08, d1: 0.74, w: 0.38, ci: pal.r2in, co: pal.r2out, off: 0.5 },
        { n: 5, d0: 0.05, d1: 0.5, w: 0.3, ci: pal.r3in, co: pal.r3out, off: 0.2 }
    ];
    rings.forEach(gr => {
        for (let i = 0; i < gr.n; i++) {
            petal((Math.PI * 2 / gr.n) * i + gr.off + (r() - 0.5) * 0.25,
                  gr.d0 * r0, gr.d1 * r0 * (0.95 + r() * 0.1), gr.w * r0, gr.ci, gr.co);
        }
    });

    c.beginPath(); c.arc(0, 0, r0 * 0.14, 0, Math.PI * 2);
    const cg = c.createRadialGradient(0, 0, 0, 0, 0, r0 * 0.16);
    cg.addColorStop(0, pal.core); cg.addColorStop(1, pal.r3in);
    c.fillStyle = cg; c.fill();

    c.save();
    blob(r0, 0.05); c.clip();
    const n = Math.floor(r0 * r0 * 0.35);
    for (let i = 0; i < n; i++) {
        const a = r() * 6.283, d = Math.sqrt(r()) * r0;
        const x = Math.cos(a) * d, y = Math.sin(a) * d * 0.93;
        line(c, x, y, 5 + r() * 10, a + Math.PI + (r() - 0.5) * 0.8, pick(r, pal.hatch), 0.18 + r() * 0.22, 1 + r());
    }
    const sh = c.createLinearGradient(-r0, -r0, r0, r0);
    sh.addColorStop(0, "rgba(255,255,255,0.10)");
    sh.addColorStop(0.5, "rgba(0,0,0,0)");
    sh.addColorStop(1, "rgba(120,20,50,0.28)");
    c.fillStyle = sh;
    c.fillRect(-r0 * 1.2, -r0 * 1.2, r0 * 2.4, r0 * 2.4);
    c.restore();

    blob(r0, 0.05);
    c.strokeStyle = pal.edge; c.globalAlpha = 0.5; c.lineWidth = 1.3; c.stroke(); c.globalAlpha = 1;
    return { cv, S };
}

/* ---------- Capullos ---------- */
function makeBud(h, w, seed) {
    const r = rng(seed);
    const S = Math.ceil((h + w + 30) * 2);
    const cv = newCanvas(S, S), c = cv.getContext("2d");
    c.translate(S / 2, S / 2);
    const path = () => {
        c.beginPath();
        c.moveTo(0, 0);
        c.bezierCurveTo(w * 1.5, -h * 0.1, w * 1.3, -h * 0.75, 0, -h);
        c.bezierCurveTo(-w * 1.3, -h * 0.75, -w * 1.5, -h * 0.1, 0, 0);
        c.closePath();
    };
    path();
    const g = c.createLinearGradient(0, 0, 0, -h);
    g.addColorStop(0, "#c9607e"); g.addColorStop(0.5, "#e892aa"); g.addColorStop(1, "#f6c7d3");
    c.fillStyle = g; c.fill();

    c.save();
    path(); c.clip();
    const cols = ["#f7c5d2", "#e67c9a", "#c94b6c", "#ffffff"];
    const n = Math.floor(h * w * 0.5);
    for (let i = 0; i < n; i++) {
        const y = -r() * h, x = (r() * 2 - 1) * w * 1.2;
        line(c, x, y, 5 + r() * 6, -1.57 + (r() - 0.5) * 0.8, pick(r, cols), 0.3, 1.1);
    }
    c.strokeStyle = "#b8456a"; c.globalAlpha = 0.5; c.lineWidth = 1.3;
    c.beginPath(); c.moveTo(-w * 0.3, -h * 0.1); c.quadraticCurveTo(w * 0.5, -h * 0.5, 0, -h * 0.97); c.stroke();
    c.globalAlpha = 1;
    c.restore();

    path();
    c.strokeStyle = "#a63c60"; c.globalAlpha = 0.6; c.lineWidth = 1.2; c.stroke(); c.globalAlpha = 1;

    for (const sd of [-1, 1]) {
        c.beginPath();
        c.moveTo(0, h * 0.03);
        c.bezierCurveTo(sd * w * 1.7, -h * 0.1, sd * w * 1.2, -h * 0.5, sd * w * 0.2, -h * 0.62);
        c.bezierCurveTo(sd * w * 0.7, -h * 0.3, sd * w * 0.2, -h * 0.1, 0, h * 0.03);
        c.fillStyle = "#3f7a3a"; c.fill();
        c.strokeStyle = "#285a2c"; c.lineWidth = 1; c.stroke();
    }
    return { cv, S };
}

/* ---------- Jarrón (capa prerenderizada) ---------- */
function buildJar() {
    const cv = newCanvas(W, H), c = cv.getContext("2d");
    const r = rng(5);
    c.lineCap = "round"; c.lineJoin = "round";

    const body = () => {
        c.beginPath();
        c.moveTo(292, 438);
        c.bezierCurveTo(298, 472, 262, 492, 232, 542);
        c.bezierCurveTo(206, 590, 198, 655, 214, 702);
        c.bezierCurveTo(234, 770, 285, 814, 308, 826);
        c.bezierCurveTo(335, 837, 396, 837, 428, 826);
        c.bezierCurveTo(470, 810, 508, 742, 512, 672);
        c.bezierCurveTo(516, 592, 482, 502, 436, 470);
        c.bezierCurveTo(424, 456, 424, 446, 428, 438);
        c.closePath();
    };

    body();
    const g = c.createLinearGradient(205, 0, 515, 0);
    g.addColorStop(0, "#5e3a1c"); g.addColorStop(0.12, "#8a5a2b"); g.addColorStop(0.32, "#c28d4e");
    g.addColorStop(0.44, "#d9ab62"); g.addColorStop(0.6, "#b27a3a"); g.addColorStop(0.82, "#7b4a22"); g.addColorStop(1, "#4a2d16");
    c.fillStyle = g; c.fill();

    c.save();
    body(); c.clip();
    const vg = c.createLinearGradient(0, 430, 0, 830);
    vg.addColorStop(0, "rgba(120,70,30,0)"); vg.addColorStop(1, "rgba(110,50,30,0.35)");
    c.fillStyle = vg; c.fillRect(190, 430, 340, 410);

    const hc = ["#7a4a20", "#a8723a", "#d9a865", "#8a3f22", "#c28d4e"];
    for (let i = 0; i < 5200; i++) {
        const x = 195 + r() * 325, y = 430 + r() * 405;
        line(c, x, y, 8 + r() * 12, 1.57 + (r() - 0.5) * 0.5, pick(r, hc), 0.2 + r() * 0.15, 1 + r());
    }
    const gl = c.createRadialGradient(330, 650, 5, 330, 650, 95);
    gl.addColorStop(0, "rgba(255,238,190,0.8)"); gl.addColorStop(1, "rgba(255,225,160,0)");
    c.fillStyle = gl; c.fillRect(220, 540, 220, 220);

    const ridge = (x0, y0, cx, cy, x1, y1, dots) => {
        c.beginPath(); c.moveTo(x0, y0); c.quadraticCurveTo(cx, cy, x1, y1);
        c.strokeStyle = "#5a3516"; c.globalAlpha = 0.6; c.lineWidth = 3; c.stroke();
        c.beginPath(); c.moveTo(x0, y0 - 3); c.quadraticCurveTo(cx, cy - 3, x1, y1 - 3);
        c.strokeStyle = "#e0b56e"; c.globalAlpha = 0.7; c.lineWidth = 2; c.stroke();
        c.globalAlpha = 1;
        if (dots) {
            for (let i = 0; i <= 46; i++) {
                const t = i / 46;
                const x = (1 - t) * (1 - t) * x0 + 2 * (1 - t) * t * cx + t * t * x1;
                const y = (1 - t) * (1 - t) * y0 + 2 * (1 - t) * t * cy + t * t * y1;
                c.beginPath(); c.arc(x, y + 10, 1.8, 0, Math.PI * 2);
                c.fillStyle = "rgba(74,45,22,0.75)"; c.fill();
            }
        }
    };
    ridge(228, 548, 360, 578, 492, 548, true);
    ridge(210, 690, 360, 722, 512, 690, false);
    c.restore();

    // Borde del cuello
    c.beginPath(); c.ellipse(360, 438, 70, 13, 0, 0, Math.PI * 2);
    c.fillStyle = "#2e1b0d"; c.fill();
    c.strokeStyle = "#b07a3e"; c.lineWidth = 4; c.stroke();
    c.beginPath(); c.ellipse(360, 436, 62, 8, 0, Math.PI, Math.PI * 2);
    c.strokeStyle = "rgba(235,200,140,0.5)"; c.lineWidth = 2; c.stroke();

    // Asa
    const hp = () => { c.beginPath(); c.moveTo(298, 466); c.bezierCurveTo(232, 462, 222, 560, 264, 646); };
    hp(); c.lineWidth = 30; c.strokeStyle = "#5a3516"; c.stroke();
    hp(); c.lineWidth = 24; c.strokeStyle = "#9a6530"; c.stroke();
    c.save(); c.translate(-4, -3);
    hp(); c.lineWidth = 8; c.strokeStyle = "#d6a35e"; c.globalAlpha = 0.8; c.stroke();
    c.restore(); c.globalAlpha = 1;

    // Gotita
    c.beginPath(); c.ellipse(266, 652, 9, 13, 0, 0, Math.PI * 2);
    c.fillStyle = "#e6c58a"; c.fill();
    c.strokeStyle = "#a9783b"; c.lineWidth = 1.5; c.stroke();
    return cv;
}

/* ---------- Composición ---------- */
// [x0, y0, cx, cy, x1, y1]
const stems = [
    [352, 442, 330, 300, 360, 175],
    [365, 442, 395, 330, 425, 150],
    [358, 442, 395, 380, 478, 290],
    [368, 442, 460, 430, 535, 425],
    [372, 445, 480, 470, 572, 528],
    [352, 442, 240, 340, 200, 185],
    [355, 442, 290, 300, 272, 182],
    [352, 442, 120, 340, 110, 182],
    [372, 442, 470, 330, 545, 225],
    [372, 442, 500, 360, 570, 290]
];

// [x, y, ang, len, wid, tone, seed]
const leafDefs = [
    [352, 300, 0.15, 95, 30, "dark", 101],
    [440, 215, 0.3, 60, 20, "mid", 102],
    [322, 118, -0.12, 108, 26, "dark", 103],
    [338, 100, 0.55, 80, 24, "mid", 104],
    [212, 192, -1.0, 62, 20, "dark", 105],
    [262, 225, -0.95, 95, 30, "mid", 106],
    [345, 330, -0.25, 100, 32, "mid", 107],
    [300, 265, -1.35, 120, 38, "light", 108],
    [255, 350, -1.25, 135, 40, "mid", 109],
    [572, 272, 1.3, 72, 24, "mid", 110],
    [420, 420, 0.6, 70, 26, "mid", 111],
    [290, 372, -1.9, 130, 40, "light", 112],
    [335, 392, -2.2, 85, 32, "dark", 113],
    [335, 425, -0.35, 85, 28, "light", 114],
    [385, 365, 3.0, 85, 36, "dark", 115],
    [488, 498, 3.3, 80, 28, "mid", 116]
];
const leaves = leafDefs.map(d => ({ x: d[0], y: d[1], ang: d[2], sp: makeLeaf(d[3], d[4], d[5], d[6]) }));

// [x, y, ang, alto, ancho, seed]
const budDefs = [
    [110, 180, -1.45, 60, 22, 201],
    [200, 185, -0.4, 60, 24, 202],
    [272, 182, 0.15, 50, 20, 203],
    [545, 225, 0.5, 60, 24, 204],
    [570, 290, 1.9, 55, 14, 205]
];
const buds = budDefs.map(d => ({ x: d[0], y: d[1], ang: d[2], sp: makeBud(d[3], d[4], d[5]) }));

// Orden: de atrás hacia adelante
const rosas = [
    { x: 360, y: 172, sp: makeRose(46, 301, ROSA_D) },
    { x: 425, y: 148, sp: makeRose(38, 302, ROSA_D) },
    { x: 572, y: 528, sp: makeRose(50, 303, ROSA_A) },
    { x: 535, y: 425, sp: makeRose(88, 304, ROSA_A) },
    { x: 478, y: 285, sp: makeRose(98, 305, ROSA_A) }
];

const JAR = buildJar();

function drawStem(c, s, p) {
    if (p <= 0) return;
    const n = Math.max(2, Math.round(40 * p));
    c.lineCap = "round";
    for (const [col, w, off] of [["#3f6b2c", 4.2, 0], ["#7aa653", 1.4, -1]]) {
        c.beginPath();
        for (let i = 0; i <= n; i++) {
            const u = i / 40;
            const x = (1 - u) * (1 - u) * s[0] + 2 * (1 - u) * u * s[2] + u * u * s[4] + off;
            const y = (1 - u) * (1 - u) * s[1] + 2 * (1 - u) * u * s[3] + u * u * s[5];
            i ? c.lineTo(x, y) : c.moveTo(x, y);
        }
        c.strokeStyle = col; c.lineWidth = w; c.stroke();
    }
}

function drawSprite(c, sp, x, y, ang, p, rot) {
    if (p <= 0) return;
    c.save();
    c.translate(x, y);
    c.rotate(ang + (rot || 0) * (1 - p));
    c.scale(p, p);
    c.globalAlpha = clamp(p * 1.6);
    c.drawImage(sp.cv, -sp.S / 2, -sp.S / 2);
    c.restore();
}

function jarFn(c, p) {
    const yTop = 840 - (840 - 420) * p;
    c.save();
    c.beginPath(); c.rect(0, yTop, W, H); c.clip();
    c.drawImage(JAR, 0, 0);
    c.restore();
}

/* ---------- Pasos de la animación ---------- */
const pasos = [
    { dur: 4000, inc: true, fn: fondoFn },
    { dur: 2000, inc: true, fn: mesaFn },
    { dur: 1600, fn: (c, p) => stems.forEach((s, i) => drawStem(c, s, sub(p, i, stems.length))) },
    { dur: 2600, fn: jarFn },
    { dur: 3800, fn: (c, p) => leaves.forEach((L, i) => drawSprite(c, L.sp, L.x, L.y, L.ang, sub(p, i, leaves.length), 0)) },
    { dur: 1800, fn: (c, p) => buds.forEach((b, i) => drawSprite(c, b.sp, b.x, b.y, b.ang, sub(p, i, buds.length), 0)) },
    { dur: 4200, fn: (c, p) => rosas.forEach((R, i) => drawSprite(c, R.sp, R.x, R.y, 0, sub(p, i, rosas.length), -0.6)) }
];

let paso = 0, t0 = 0, raf = 0;

function frame(now) {
    if (!t0) t0 = now;
    const st = pasos[paso];
    const lin = clamp((now - t0) / st.dur);
    if (st.inc) {
        st.fn(bctx, lin);
        ctx.drawImage(base, 0, 0);
    } else {
        const p = ease(lin);
        ctx.drawImage(base, 0, 0);
        st.fn(ctx, p);
    }
    if (lin >= 1) {
        st.fn(bctx, 1);
        paso++;
        t0 = 0;
        if (paso >= pasos.length) {
            ctx.drawImage(base, 0, 0);
            document.getElementById("texto").classList.add("visible");
            return;
        }
    }
    raf = requestAnimationFrame(frame);
}

function iniciar() {
    if (raf) cancelAnimationFrame(raf);
    document.getElementById("texto").classList.remove("visible");
    bctx.fillStyle = PAPER;
    bctx.fillRect(0, 0, W, H);
    ctx.drawImage(base, 0, 0);
    stFondo.n = 0; stMesa.n = 0; stMesa.sh = false;
    paso = 0; t0 = 0;
    raf = requestAnimationFrame(frame);
}

iniciar();
</script>
